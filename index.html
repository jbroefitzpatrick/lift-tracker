<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://raw.githubusercontent.com; connect-src 'self' https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lift Tracker</title>
  <meta name="description" content="Personal lifting tracker with built-in progression.">
  <meta name="theme-color" content="#0c0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main"></main>

  <div id="rest" hidden role="timer" aria-label="Rest timer">
    <div class="row">
      <div class="grow"><div id="rest-label">Rest</div><div id="rest-time" class="tnum">0:00</div></div>
      <button id="rest-minus" class="mini" aria-label="15 seconds less">−15</button>
      <button id="rest-plus" class="mini" aria-label="15 seconds more">+15</button>
      <button id="rest-skip" class="mini">Skip</button>
    </div>
    <div id="rest-track"><div id="rest-bar"></div></div>
  </div>

  <nav id="tabs" aria-label="Sections"></nav>
  <div id="sheet" hidden><div id="sheet-body" role="dialog" aria-modal="true" tabindex="-1"></div></div>
  <div id="toast" hidden role="status" aria-live="polite"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
